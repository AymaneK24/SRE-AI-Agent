# Shop: a small online shop for testing Root Cause Console on a local cluster (Docker Desktop, kind, minikube).
#
# Some services are healthy, and the others each fail in a different, realistic way:
#
#   frontend         healthy, 2 replicas
#   catalog          healthy, serves HTTP and passes its probes
#   cart-cache       healthy StatefulSet (Redis)
#   orders           healthy, but writes an ERROR line every 20 s (log noise and log alerts)
#   payment          crash loop: exits on start because postgres has no pods ("connection refused")
#   postgres         a Service with no pods behind it: the real cause of the payment crash
#   recommendations  image pull failure: the tag doesn't exist
#   checkout         can't start: refers to a Secret that doesn't exist
#   image-resizer    out of memory: killed at its 32Mi limit, again and again
#   inventory        killed by its liveness probe, again and again
#   search           running but never ready (wrong readiness port), so its rollout gets stuck
#   reporting        can't be scheduled: asks for more memory than any node has
#
#   kubectl apply -f deploy/examples/shop-simulation.yaml
#   kubectl -n shop get pods -w            # failures appear within 1 to 3 minutes
#   kubectl delete namespace shop          # removes everything
#
# Everything here only uses public images, small CPU and memory requests, and nothing outside the namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: shop
  labels: { app.kubernetes.io/part-of: shop }
---
# ---------------------------------------------------------------- healthy: frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shop
  labels: { app: frontend, app.kubernetes.io/part-of: shop }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend, app.kubernetes.io/part-of: shop } }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          readinessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 20 }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: shop }
spec:
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80 }]
---
# ---------------------------------------------------------------- healthy: catalog
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: shop
  labels: { app: catalog, app.kubernetes.io/part-of: shop }
spec:
  replicas: 1
  selector: { matchLabels: { app: catalog } }
  template:
    metadata: { labels: { app: catalog, app.kubernetes.io/part-of: shop } }
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /www && echo '{"products": 128}' > /www/index.html
              echo "catalog-service v1.8.0 listening on :8080"
              exec httpd -f -p 8080 -h /www
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /, port: 8080 }, periodSeconds: 10 }
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits: { memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata: { name: catalog, namespace: shop }
spec:
  selector: { app: catalog }
  ports: [{ port: 8080, targetPort: 8080 }]
---
# ---------------------------------------------------------------- healthy: cart-cache (StatefulSet)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cart-cache
  namespace: shop
  labels: { app: cart-cache, app.kubernetes.io/part-of: shop }
spec:
  serviceName: cart-cache
  replicas: 1
  selector: { matchLabels: { app: cart-cache } }
  template:
    metadata: { labels: { app: cart-cache, app.kubernetes.io/part-of: shop } }
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports: [{ containerPort: 6379 }]
          readinessProbe: { exec: { command: ["redis-cli", "ping"] }, periodSeconds: 10 }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata: { name: cart-cache, namespace: shop }
spec:
  clusterIP: None
  selector: { app: cart-cache }
  ports: [{ port: 6379, targetPort: 6379 }]
---
# ---------------------------------------------------------------- healthy but noisy: orders
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: shop
  labels: { app: orders, app.kubernetes.io/part-of: shop }
spec:
  replicas: 1
  selector: { matchLabels: { app: orders } }
  template:
    metadata: { labels: { app: orders, app.kubernetes.io/part-of: shop } }
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "orders-worker v4.2.0 started"
              n=0
              while true; do
                n=$((n+1))
                echo "INFO processed order batch=$n size=$((n % 7 + 3))"
                if [ $((n % 4)) -eq 0 ]; then
                  echo "ERROR: timeout calling payment:8080/charge after 2000ms (attempt 1 of 3, retrying)"
                fi
                sleep 5
              done
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 32Mi }
---
# ---------------------------------------------------------------- crash loop: payment can't reach postgres
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: shop
  labels: { app: payment, app.kubernetes.io/part-of: shop }
spec:
  replicas: 1
  selector: { matchLabels: { app: payment } }
  template:
    metadata: { labels: { app: payment, app.kubernetes.io/part-of: shop } }
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "payment-service v2.3.1 starting"
              echo "connecting to database postgres:5432"
              if nc -w 3 postgres 5432 </dev/null; then
                echo "database connected"; exec sleep 3600
              fi
              echo "ERROR: connection refused postgres:5432"
              echo "FATAL: cannot start without a database, exiting"
              exit 1
          env:
            - { name: DATABASE_HOST, value: postgres }
            - { name: DATABASE_PORT, value: "5432" }
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits: { memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata: { name: payment, namespace: shop }
spec:
  selector: { app: payment }
  ports: [{ port: 8080, targetPort: 8080 }]
---
# The database Service exists, but nothing matches its selector: the real root cause behind payment.
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: shop }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
# ---------------------------------------------------------------- image pull failure: recommendations
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendations
  namespace: shop
  labels: { app: recommendations, app.kubernetes.io/part-of: shop }
spec:
  replicas: 1
  selector: { matchLabels: { app: recommendations } }
  template:
    metadata: { labels: { app: recommendations, app.kubernetes.io/part-of: shop } }
    spec:
      containers:
        - name: api
          image: nginx:9.9.9-doesnotexist
          resources:
            requests: { cpu: 10m, memory: 16Mi }
---
# ---------------------------------------------------------------- config error: checkout needs a missing Secret
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: shop
  labels: { app: checkout, app.kubernetes.io/part-of: shop }
spec:
  replicas: 1
  selector: { matchLabels: { app: checkout } }
  template:
    metadata: { labels: { app: checkout, app.kubernetes.io/part-of: shop } }
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c", "echo checkout starting; exec sleep 3600"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: checkout-db-credentials, key: password }
          resources:
            requests: { cpu: 5m, memory: 8Mi }
---
# ---------------------------------------------------------------- out of memory: image-resizer
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-resizer
  namespace: shop
  labels: { app: image-resizer, app.kubernetes.io/part-of: shop }
spec:
  replicas: 1
  selector: { matchLabels: { app: image-resizer } }
  template:
    metadata: { labels: { app: image-resizer, app.kubernetes.io/part-of: shop } }
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c"]
          # tail keeps reading /dev/zero into memory until the 32Mi limit kills it.
          args: ["echo 'image-resizer v0.9.2 loading thumbnails into memory'; tail /dev/zero"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
---
# ---------------------------------------------------------------- liveness kill: inventory
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: shop
  labels: { app: inventory, app.kubernetes.io/part-of: shop }
spec:
  replicas: 1
  selector: { matchLabels: { app: inventory } }
  template:
    metadata: { labels: { app: inventory, app.kubernetes.io/part-of: shop } }
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /www && echo ok > /www/index.html
              echo "inventory-service v3.0.0 listening on :8080"
              exec httpd -f -p 8080 -h /www
          ports: [{ containerPort: 8080 }]
          # /healthz doesn't exist, so the probe fails and Kubernetes kills the container.
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 32Mi }
---
# ---------------------------------------------------------------- never ready, rollout stuck: search
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  namespace: shop
  labels: { app: search, app.kubernetes.io/part-of: shop }
spec:
  replicas: 1
  progressDeadlineSeconds: 90
  selector: { matchLabels: { app: search } }
  template:
    metadata: { labels: { app: search, app.kubernetes.io/part-of: shop } }
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          # nginx listens on 80, but the probe checks 8081, so the pod never becomes ready.
          readinessProbe:
            httpGet: { path: /, port: 8081 }
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata: { name: search, namespace: shop }
spec:
  selector: { app: search }
  ports: [{ port: 80, targetPort: 80 }]
---
# ---------------------------------------------------------------- unschedulable: reporting
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting
  namespace: shop
  labels: { app: reporting, app.kubernetes.io/part-of: shop }
spec:
  replicas: 1
  selector: { matchLabels: { app: reporting } }
  template:
    metadata: { labels: { app: reporting, app.kubernetes.io/part-of: shop } }
    spec:
      containers:
        - name: job
          image: busybox:1.36
          command: ["sh", "-c", "exec sleep 3600"]
          resources:
            requests: { cpu: 10m, memory: 200Gi }
