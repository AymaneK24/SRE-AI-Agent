# Added on top of values.yaml for a customer's real cluster:
#
#   PROFILE=production bash deploy/examples/monitoring/install.sh
#
# values.yaml is tuned for laptops. On a real cluster, put back what Docker Desktop can't do,
# and size Prometheus for more nodes and a longer history.

defaultRules:
  disabled:
    # Real machines keep their clocks in sync, so this rule is meaningful again.
    NodeClockSkewDetected: false

prometheus:
  service:
    # Reach Prometheus through an internal load balancer, an ingress with sign-in, or from inside the
    # cluster, not through a port open on every node.
    type: ClusterIP
  prometheusSpec:
    retention: 15d
    retentionSize: 40GB
    resources:
      requests: { cpu: 500m, memory: 2Gi }
      limits: { memory: 6Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests: { storage: 50Gi }

prometheus-node-exporter:
  # Disk use and "disk filling up" alerts need the host's root filesystem.
  hostRootFsMount:
    enabled: true
