# Optional: limit traffic inside the rcc namespace. Needs a network plugin that enforces NetworkPolicy,
# such as Azure Network Policy Manager, Calico, or Cilium (on AKS: --network-policy azure, calico, or cilium).
#
#   Caddy      accepts 80 and 443 from anywhere
#   console    accepts 8000 only from Caddy
#   postgres   accepts 5432 only from the console
#
# Outgoing traffic stays open, because the console must reach your monitoring systems and AI model.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: rcc
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: caddy-from-anywhere
  namespace: rcc
spec:
  podSelector:
    matchLabels: { app: caddy }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: 80, protocol: TCP }
        - { port: 443, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: console-from-caddy
  namespace: rcc
spec:
  podSelector:
    matchLabels: { app: console }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: caddy }
      ports:
        - { port: 8000, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-console
  namespace: rcc
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: console }
      ports:
        - { port: 5432, protocol: TCP }
