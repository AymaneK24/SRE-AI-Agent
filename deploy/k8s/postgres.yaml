# PostgreSQL inside the cluster, on an Azure disk. Replace it with Azure Database for PostgreSQL for important data.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: rcc
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: rcc
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: ACR_NAME.azurecr.io/postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: rcc
            - name: POSTGRES_DB
              value: rcc
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rcc-secrets
                  key: POSTGRES_PASSWORD
            # A new Azure disk has a lost+found folder, so the data needs its own folder.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "rcc", "-d", "rcc"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: managed-csi
        resources:
          requests:
            storage: 32Gi
