# Root Cause Console: the app, PostgreSQL, and Caddy for HTTPS.
#
#   sh deploy/setup-env.sh           Asks a few questions and writes .env with new secrets.
#   docker login dhi.io              Once. The image is built on Docker Hardened Images (free Docker account).
#   docker compose up -d --build     Starts everything.
#
# No Docker account? Set RCC_DOCKERFILE=Dockerfile.alpine in .env to build the hand-hardened Alpine image.
#
# See docs/DEPLOY.md.
services:
  console:
    build:
      context: .
      dockerfile: ${RCC_DOCKERFILE:-Dockerfile}
    image: ${RCC_IMAGE:-root-cause-console:latest}
    env_file: .env
    environment:
      RCC_MODE: production
      RCC_DATABASE_URL: "postgresql://rcc:${POSTGRES_PASSWORD:?Run sh deploy/setup-env.sh first}@postgres:5432/rcc"
      RCC_TRUST_PROXY: "true"
    depends_on:
      postgres:
        condition: service_healthy
    # Not published. Only Caddy reaches it.
    expose:
      - "8000"
    # Lets the console reach Ollama or Prometheus running on this same machine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - console-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Reached only by the console, because it has no published port.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rcc
      POSTGRES_DB: rcc
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Run sh deploy/setup-env.sh first}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rcc -d rcc"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  caddy:
    # caddy:2-alpine, or rcc-caddy-dns:2 (deploy/caddy-dns) for Let's Encrypt through Azure DNS on a private server.
    image: ${RCC_CADDY_IMAGE:-caddy:2-alpine}
    environment:
      RCC_DOMAIN: "${RCC_DOMAIN:?Run sh deploy/setup-env.sh first}"
      # The certificate to use when a client sends no server name, as happens with https://IP-ADDRESS.
      RCC_DEFAULT_SNI: "${RCC_DEFAULT_SNI:-localhost}"
      # Only used by deploy/Caddyfile.azure-dns. The VM's managed identity signs in, so no secret is needed.
      AZURE_SUBSCRIPTION_ID: "${AZURE_SUBSCRIPTION_ID:-}"
      AZURE_RESOURCE_GROUP_NAME: "${AZURE_RESOURCE_GROUP_NAME:-}"
    ports:
      - "${RCC_HTTP_PORT:-80}:80"
      - "${RCC_HTTPS_PORT:-443}:443"
    volumes:
      # Defaults to a certificate Caddy makes itself, so a missing setting never asks Let's Encrypt over the internet.
      - ${RCC_CADDYFILE:-./deploy/Caddyfile.selfsigned}:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - console
    restart: unless-stopped

volumes:
  console-data:
  postgres-data:
  caddy-data:
  caddy-config:
