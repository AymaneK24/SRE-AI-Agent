apiVersion: v1
kind: Namespace
metadata: { name: logging }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: loki, namespace: logging }
spec:
  replicas: 1
  selector: { matchLabels: { app: loki } }
  template:
    metadata: { labels: { app: loki } }
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.5.0
          ports: [{ containerPort: 3100 }]
          readinessProbe:
            { httpGet: { path: /ready, port: 3100 }, initialDelaySeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: loki, namespace: logging }
spec:
  type: LoadBalancer # Docker Desktop publishes this on localhost:3100
  selector: { app: loki }
  ports: [{ port: 3100, targetPort: 3100 }]
