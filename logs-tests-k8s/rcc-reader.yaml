apiVersion: v1
kind: ServiceAccount
metadata: { name: rcc-reader, namespace: logging }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: rcc-reader }
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, nodes, services]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: rcc-reader }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: rcc-reader }
subjects: [{ kind: ServiceAccount, name: rcc-reader, namespace: logging }]