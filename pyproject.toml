[project]
name = "root-cause-console"
version = "3.0.0"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Aymane KENBOUCH" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
exclude = ["app/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S"]
ignore = ["E501", "S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
files = ["app"]
ignore_missing_imports = true
