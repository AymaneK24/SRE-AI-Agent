# SonarQube Cloud analysis. The organization and project key come from the workflow's sign-in step.
sonar.projectName=Root Cause Console

# The app, plus what deploys it: Dockerfiles, Compose, and the Kubernetes manifests.
sonar.sources=app,deploy,Dockerfile,docker-compose.yml
sonar.tests=tests
# Third-party files, and the deliberately broken demo shop people deploy to watch the console find failures.
sonar.exclusions=app/static/vendor/**,app/static/fonts/**,deploy/examples/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
