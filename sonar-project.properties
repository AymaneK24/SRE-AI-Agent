# SonarQube Cloud analysis. The organization and project key come from the workflow
# (variables SONAR_ORGANIZATION and SONAR_PROJECT_KEY), so this file holds only what's the same everywhere.
sonar.projectName=Root Cause Console
sonar.sources=app
sonar.tests=tests
sonar.exclusions=app/static/vendor/**,app/static/fonts/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
