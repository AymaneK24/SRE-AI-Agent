# SonarQube Cloud analysis. The organization and project key come from the workflow's sign-in step.
# SonarQube Cloud analyzes the whole repository (sonar.sources and sonar.tests no longer have an effect),
# so what to leave out is set with exclusions below.
sonar.projectName=Root Cause Console

# Third-party files, the deliberately broken demo shop people deploy to watch the console find failures,
# and the local Loki test setup.
sonar.exclusions=app/static/vendor/**,app/static/fonts/**,deploy/examples/**,logs-tests-k8s/**

# Coverage is measured for the app's Python code, by pytest (coverage.xml). Left out of the coverage figure only,
# while still analyzed for bugs and security issues:
#   app/static/js/**  the browser interface, which has no JavaScript test suite
#   tests/**          the tests themselves
#   .github/**        CI helper scripts
#   deploy/**         build and install scripts, Dockerfiles, and manifests
sonar.coverage.exclusions=app/static/js/**,tests/**,.github/**,deploy/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
