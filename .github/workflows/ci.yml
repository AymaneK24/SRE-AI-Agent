name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rcc
          POSTGRES_PASSWORD: rcc
          POSTGRES_DB: rcc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rcc" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Locked versions with hashes, prebuilt wheels only: no setup script from a package runs here.
      # After changing requirements*.txt, regenerate with the command at the top of requirements-dev.lock.
      - run: "pip install --only-binary=:all: --require-hashes -r requirements-dev.lock"
      - run: ruff check .
      - run: python -m mypy
      - run: pip-audit -r requirements.txt
      - run: pytest
        env:
          RCC_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://rcc:rcc@127.0.0.1:5432/rcc_test' || '' }}
