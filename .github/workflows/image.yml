# Builds the console image on Docker Hardened Images, checks that it starts, and publishes it to Docker Hub
# with an SBOM and provenance attached.
#
# Setup, once, in the repository's Settings > Secrets and variables > Actions:
#   Secret   DOCKERHUB_USERNAME   the Docker account that pushes, also used to pull from dhi.io
#   Secret   DOCKERHUB_TOKEN      a personal access token of that account, with Read & Write access
#   Variable DOCKERHUB_IMAGE      optional, defaults to rootcauseconsole/root-cause-console
#
# Publishes when a version tag like v1.2.0 is pushed, or when run by hand from the Actions tab.
name: Image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push:
        description: Publish to Docker Hub
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'rootcauseconsole/root-cause-console' }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # The hardened base images are pulled from dhi.io with the same Docker account.
      - name: Sign in to Docker Hardened Images
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short

      # Build for this runner first and check that the app starts and answers its health check.
      - name: Build for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          load: true
          tags: rcc-test:latest

      - name: Check that the image starts
        run: |
          docker run -d --name rcc -e RCC_ALLOW_LOOPBACK_TARGETS=true rcc-test:latest
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' rcc)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker logs rcc | tail -20
          [ "$(docker inspect -f '{{.State.Health.Status}}' rcc)" = healthy ]
          [ "$(docker inspect -f '{{.Config.User}}' rcc)" = "10001:10001" ]
          # No shell in the image, by design.
          ! docker exec rcc sh -c true 2>/dev/null

      - name: Build and publish
        if: startsWith(github.ref, 'refs/tags/v') || inputs.push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
