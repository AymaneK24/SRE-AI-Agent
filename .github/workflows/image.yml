# Build, scan, and publish the console image.
#
#   1. sonarqube   Tests with coverage, then SonarQube Cloud analysis. A failed quality gate stops the pipeline.
#                  Signs in without a stored secret: GitHub's OIDC token is exchanged for a short-lived Sonar token.
#   2. trivy-repo  Trivy on the source: vulnerable dependencies, leaked secrets, Dockerfile and Kubernetes misconfigurations.
#   3. image       Builds on Docker Hardened Images, scans the image with Trivy, checks it starts healthy,
#                  then publishes linux/amd64 and linux/arm64 to Docker Hub with an SBOM and provenance.
#
# Pushes to dev and pull requests run the analysis and scans; dev also builds and checks the image.
# Only pushes to main and manual runs (Actions > Image > Run workflow) publish, as VERSION below.
#
# One-time setup in Settings > Secrets and variables > Actions:
#   Secret    DOCKERHUB_USERNAME   Docker account that pushes; also signs in to dhi.io for the base image
#   Secret    DOCKERHUB_TOKEN      Personal access token of that account, Read & Write
#   Variable  DOCKERHUB_IMAGE      Optional. Defaults to rootcauseconsole/root-cause-console
#
# SonarQube Cloud needs no secret here: the project is bound to this repository, and the organization and project
# key come from the sign-in step. Turn off "Automatic Analysis" for the project, since this workflow runs it.
#
# Every action is pinned to a full commit SHA, with the version in a comment. After the March 2026 Trivy
# compromise, where release tags were moved to malicious commits, tags alone aren't trusted here.
name: Image

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  # The version published to Docker Hub, as rootcauseconsole/root-cause-console:VERSION and :latest.
  # Raise it for each release (6.0.0 -> 6.0.1 for fixes, 6.1.0 for features, 7.0.0 for breaking changes).
  # Publishing the same version again replaces that image, so change it before merging a release to main.
  VERSION: "6.0.0"
  IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'rootcauseconsole/root-cause-console' }}
  TRIVY_VERSION: v0.70.0

jobs:
  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # exchanged for a short-lived SonarQube Cloud token; no stored secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so SonarQube can attribute new code and blame
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Tests with coverage
        run: pytest -q --cov=app --cov-report=xml:coverage.xml
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Sign in to SonarQube Cloud
        id: sonar-auth
        uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2
        with:
          project-key: AymaneK24_SRE-AI-Agent
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        with:
          args: >
            -Dsonar.organization=${{ steps.sonar-auth.outputs.organization }}
            -Dsonar.projectKey=${{ steps.sonar-auth.outputs.project-key }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  trivy-repo:
    name: Trivy on the source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # uploads results to the Security tab when code scanning is available
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fail on fixable critical or high findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-dirs: app/static/vendor,tests,logs-tests-k8s
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          format: table
      - name: Full report for the Security tab
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          skip-dirs: app/static/vendor,tests,logs-tests-k8s
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy-repo.sarif
      # Code scanning is free for public repositories. Private ones need GitHub Advanced Security.
      - name: Upload to the Security tab
        if: always() && !github.event.repository.private
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-repo.sarif
          category: trivy-repo

  image:
    name: Build, scan, and publish the image
    needs: [sonarqube, trivy-repo]
    # Pull requests stop after the analysis and scans; the push to their branch builds the image.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check VERSION
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "VERSION must look like 6.0.0, not '$VERSION'"; exit 1; }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to Docker Hardened Images
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Sign in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.VERSION }},priority=1000
            type=raw,value=latest
            type=sha,format=short

      # Built once for this runner, then scanned and started before anything is published.
      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          load: true
          tags: rcc-scan:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy on the image (fails on fixable critical or high)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: rcc-scan:${{ github.sha }}
          trivyignores: .trivyignore.yaml
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Trivy image report for the Security tab
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          image-ref: rcc-scan:${{ github.sha }}
          trivyignores: .trivyignore.yaml
          scanners: vuln,secret
          format: sarif
          output: trivy-image.sarif
      - name: Upload to the Security tab
        if: always() && !github.event.repository.private
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Check that the image starts
        run: |
          docker run -d --name rcc rcc-scan:${{ github.sha }}
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' rcc)" = healthy ] && break
            sleep 2
          done
          docker logs rcc 2>&1 | tail -20
          [ "$(docker inspect -f '{{.State.Health.Status}}' rcc)" = healthy ]
          [ "$(docker inspect -f '{{.Config.User}}' rcc)" = "10001:10001" ]
          if docker exec rcc sh -c true 2>/dev/null; then echo "The image must not contain a shell"; exit 1; fi

      - name: Publish to Docker Hub
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha

      - name: Summary
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "### Published ${IMAGE}"
            echo
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
